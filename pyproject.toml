[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lablens-agent"
version = "0.4.0"
description = "Evidence-grounded experiment analysis agent with auditable tool traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lablens = "lablens.cli:main"

[tool.setuptools.packages.find]
include = ["lablens*"]

[tool.setuptools.package-data]
lablens = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
