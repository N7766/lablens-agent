name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline reconstruction tests hash-check the pinned historical candidate.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: lablens demo --output reports/offline-demo.json
      - run: python scripts/verify_dpo_case.py --self-test > reports/dpo-case-verification.json
      - run: python scripts/evaluate_workspace_system.py --self-test

  workspace-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/workspace/tests/*.test.cjs

  workspace-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lablens_workspace
          MYSQL_USER: lablens
          MYSQL_PASSWORD: local-ci-only
          MYSQL_ROOT_PASSWORD: local-ci-root-only
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:8.2.2-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=2s --health-retries=10
      rabbitmq:
        image: rabbitmq:4.4.0
        env:
          RABBITMQ_DEFAULT_USER: lablens_ci
          RABBITMQ_DEFAULT_PASS: local-ci-mq-only
          RABBITMQ_DEFAULT_VHOST: lablens_ci
        ports: ['5673:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LABLENS_DB_URL: jdbc:mysql://127.0.0.1:3307/lablens_workspace?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      LABLENS_DB_USER: lablens
      LABLENS_DB_PASSWORD: local-ci-only
      LABLENS_REDIS_PORT: '6380'
      LABLENS_INTEGRATION_TESTS: 'true'
      LABLENS_MQ_INTEGRATION_TESTS: 'true'
      LABLENS_MQ_HOST: '127.0.0.1'
      LABLENS_MQ_PORT: '5673'
      LABLENS_MQ_USERNAME: lablens_ci
      LABLENS_MQ_PASSWORD: local-ci-mq-only
      LABLENS_MQ_VHOST: lablens_ci
      LABLENS_MQ_EVIDENCE_DIR: ${{ github.workspace }}/reports/ci/mq
      LABLENS_MQ_RESTART_MARKER: ${{ github.workspace }}/reports/ci/restart-marker.json
      # Legacy system/load cases exercise queue mechanics in explicit loopback dev mode.
      # The authenticated cross-service matrix runs separately below.
      LABLENS_AUTH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/workspace/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: mvn -B -f services/workspace/pom.xml verify
      - name: Preserve complete test matrix before restart phases
        run: cp -R services/workspace/target/surefire-reports reports/ci/full-matrix-surefire
      - name: Confirm persistent message before real broker restart
        env:
          LABLENS_MQ_RESTART_PHASE: prepare
        run: mvn -B -f services/workspace/pom.xml '-Dtest=TaskMqIntegrationTest#brokerRestartPrepare' test
      - name: Restart isolated broker container
        env:
          BROKER_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: |
          docker inspect --format '{{.State.StartedAt}}' "$BROKER_CONTAINER" > reports/ci/broker-before.txt
          docker restart "$BROKER_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$BROKER_CONTAINER" rabbitmq-diagnostics -q ping; then
              docker inspect --format '{{.State.StartedAt}}' "$BROKER_CONTAINER" > reports/ci/broker-after.txt
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify same persistent message after restart
        env:
          LABLENS_MQ_RESTART_PHASE: verify
        run: mvn -B -f services/workspace/pom.xml '-Dtest=TaskMqIntegrationTest#brokerRestartVerify' test
      - name: Start real Python and JVM services
        run: |
          mkdir -p reports/ci
          python -m uvicorn lablens.api:app --host 127.0.0.1 --port 8765 > reports/ci/python.log 2>&1 &
          echo $! > reports/ci/worker.pid
          LABLENS_MQ_ENABLED=true java -jar services/workspace/target/lablens-workspace-0.12.0.jar > reports/ci/workspace.log 2>&1 &
          echo $! > reports/ci/workspace.pid
          python - <<'PY'
          import time, httpx
          with httpx.Client(trust_env=False) as client:
              for _ in range(60):
                  try:
                      r = client.get('http://127.0.0.1:8081/api/system/status')
                      worker = client.get('http://127.0.0.1:8765/health')
                      if r.is_success and r.json()['database'] == 'available' and worker.is_success:
                          break
                  except httpx.HTTPError:
                      pass
                  time.sleep(1)
              else:
                  raise SystemExit('Workspace did not start')
          PY
      - name: Cross-service offline checks and small load run
        run: python scripts/evaluate_workspace_system.py --output reports/ci/system
      - name: Authenticated cross-service identity and role matrix
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          kill "$(cat reports/ci/workspace.pid)" "$(cat reports/ci/worker.pid)"
          python - <<'PY'
          import socket,time
          for port in (8081,8765):
              deadline=time.monotonic()+30
              while True:
                  with socket.socket() as s:
                      if s.connect_ex(('127.0.0.1',port)) != 0: break
                  if time.monotonic()>deadline: raise SystemExit('Legacy CI service did not stop')
                  time.sleep(.1)
          PY
          docker exec -e MYSQL_PWD=local-ci-root-only "$MYSQL_CONTAINER" mysql -uroot -e "CREATE DATABASE lablens_auth_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; GRANT ALL ON lablens_auth_ci.* TO 'lablens'@'%';"
          export LABLENS_DB_URL='jdbc:mysql://127.0.0.1:3307/lablens_auth_ci?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
          export LABLENS_AUTH_ENABLED=true
          export LABLENS_CHECKPOINTS_ENABLED=true
          export LABLENS_CHECKPOINT_BASE_URL=http://127.0.0.1:8081
          export LABLENS_SERVICE_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          export LABLENS_AUTH_BOOTSTRAP_PASSWORD="$(python -c 'import secrets;print(secrets.token_urlsafe(24))')"
          export LABLENS_AUTH_BOOTSTRAP_USERNAME=ci_admin
          export LABLENS_INDEX_DB="$PWD/reports/ci/auth-index.sqlite"
          # Scripted local HTTP responses validate transport/persistence, not model quality.
          export LLM_BASE_URL=http://127.0.0.1:8771/v1
          export LLM_API_KEY=synthetic-round17-fixture-only
          export LLM_MODEL=round17-scripted-not-an-llm
          export EMBEDDING_BASE_URL=http://127.0.0.1:9/v1
          export EMBEDDING_API_KEY=''
          python scripts/round17_local_model_fixture.py --output reports/ci/memory-fixture.jsonl > reports/ci/memory-fixture.log 2>&1 &
          echo $! > reports/ci/auth-fixture.pid
          python -m uvicorn lablens.api:app --host 127.0.0.1 --port 8765 > reports/ci/auth-python.log 2>&1 &
          echo $! > reports/ci/auth-worker.pid
          LABLENS_MQ_ENABLED=false java -jar services/workspace/target/lablens-workspace-0.12.0.jar > reports/ci/auth-workspace.log 2>&1 &
          python - <<'PY'
          import time,httpx
          with httpx.Client(trust_env=False,timeout=2) as c:
              for _ in range(60):
                  try:
                      if c.get('http://127.0.0.1:8081/actuator/health').is_success and c.get('http://127.0.0.1:8765/health').is_success: break
                  except httpx.HTTPError: pass
                  time.sleep(1)
              else: raise SystemExit('Authenticated services did not start')
          PY
          python scripts/verify_workspace_auth.py --base-url http://127.0.0.1:8081 --worker-url http://127.0.0.1:8765 --output reports/ci/auth-matrix.json
          python scripts/verify_workspace_memory.py --base-url http://127.0.0.1:8081 --output reports/ci/memory-matrix.json
          kill "$(cat reports/ci/auth-worker.pid)" "$(cat reports/ci/auth-fixture.pid)"
          python - <<'PY'
          import socket,time
          for port in (8765,8771):
              deadline=time.monotonic()+20
              while True:
                  with socket.socket() as s:
                      if s.connect_ex(('127.0.0.1',port)) != 0: break
                  if time.monotonic()>deadline: raise SystemExit('Owned fixture services did not stop')
                  time.sleep(.1)
          PY
          export LABLENS_CHECKPOINT_BASE_URL=http://127.0.0.1:8772
          export LABLENS_AGENT_TOOL_BASE_URL=http://127.0.0.1:8772
          python scripts/round18_recovery_fixture.py --jvm http://127.0.0.1:8081 --worker http://127.0.0.1:8765 --output reports/ci/recovery/model-requests.jsonl --events reports/ci/recovery/checkpoint-events.jsonl > reports/ci/recovery-fixture.log 2>&1 &
          python - <<'PY'
          import time,httpx
          with httpx.Client(trust_env=False,timeout=2) as c:
              for _ in range(50):
                  try:
                      if c.get('http://127.0.0.1:8771').is_success: break
                  except httpx.HTTPError: pass
                  time.sleep(.1)
              else: raise SystemExit('Recovery fixture did not start')
          PY
          python scripts/verify_workspace_recovery.py --base-url http://127.0.0.1:8081 --worker-port 8765 --output reports/ci/recovery/matrix.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-integration-evidence
          path: |
            services/workspace/target/surefire-reports/
            reports/ci/
