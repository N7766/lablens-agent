server.address=${LABLENS_WORKSPACE_BIND:127.0.0.1}
server.port=${LABLENS_WORKSPACE_PORT:8081}
spring.application.name=lablens-workspace
spring.datasource.url=${LABLENS_DB_URL:jdbc:mysql://127.0.0.1:3307/lablens_workspace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${LABLENS_DB_USER:lablens}
spring.datasource.password=${LABLENS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.data.redis.host=${LABLENS_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${LABLENS_REDIS_PORT:6380}
spring.data.redis.password=${LABLENS_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.health.redis.enabled=false
lablens.worker-base-url=${LABLENS_WORKER_BASE_URL:http://127.0.0.1:8765}
lablens.worker-timeout-seconds=${LABLENS_WORKER_TIMEOUT_SECONDS:90}
lablens.workers=${LABLENS_WORKERS:2}
lablens.task-lease-seconds=${LABLENS_TASK_LEASE_SECONDS:180}
lablens.cache-ttl-seconds=${LABLENS_CACHE_TTL_SECONDS:300}
lablens.cache-namespace=${LABLENS_CACHE_NAMESPACE:conversation-round5-agent-v6}
lablens.rate-limit=${LABLENS_RATE_LIMIT:120}
lablens.max-pending-tasks=${LABLENS_MAX_PENDING_TASKS:200}
lablens.dispatch-enabled=${LABLENS_DISPATCH_ENABLED:true}
