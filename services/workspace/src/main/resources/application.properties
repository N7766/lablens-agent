server.address=${LABLENS_WORKSPACE_BIND:127.0.0.1}
server.port=${LABLENS_WORKSPACE_PORT:8081}
spring.application.name=lablens-workspace
spring.datasource.url=${LABLENS_DB_URL:jdbc:mysql://127.0.0.1:3307/lablens_workspace?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${LABLENS_DB_USER:lablens}
spring.datasource.password=${LABLENS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${LABLENS_DB_POOL_MAX:12}
spring.datasource.hikari.minimum-idle=${LABLENS_DB_POOL_MIN_IDLE:${LABLENS_DB_POOL_MAX:12}}
spring.datasource.hikari.connection-timeout=${LABLENS_DB_ACQUIRE_TIMEOUT_MS:3000}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.data.redis.host=${LABLENS_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${LABLENS_REDIS_PORT:6380}
spring.data.redis.password=${LABLENS_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
# Keep the existing platform-thread Tomcat budgets explicit; this is not capacity tuning.
server.tomcat.threads.max=${LABLENS_HTTP_THREADS_MAX:200}
server.tomcat.threads.min-spare=${LABLENS_HTTP_THREADS_MIN:10}
server.tomcat.max-connections=${LABLENS_HTTP_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${LABLENS_HTTP_ACCEPT_COUNT:100}
server.tomcat.mbeanregistry.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.health.redis.enabled=false
lablens.worker-base-url=${LABLENS_WORKER_BASE_URL:http://127.0.0.1:8765}
lablens.worker-timeout-seconds=${LABLENS_WORKER_TIMEOUT_SECONDS:90}
lablens.workers=${LABLENS_WORKERS:2}
lablens.task-lease-seconds=${LABLENS_TASK_LEASE_SECONDS:180}
lablens.cache-ttl-seconds=${LABLENS_CACHE_TTL_SECONDS:300}
lablens.cache-namespace=${LABLENS_CACHE_NAMESPACE:conversation-round9-agent-v10}
lablens.rate-limit=${LABLENS_RATE_LIMIT:120}
lablens.max-pending-tasks=${LABLENS_MAX_PENDING_TASKS:200}
lablens.max-pending-global=${LABLENS_MAX_PENDING_GLOBAL:1000}
lablens.dispatch-enabled=${LABLENS_DISPATCH_ENABLED:true}
lablens.dispatch-poll-ms=${LABLENS_DISPATCH_POLL_MS:250}
lablens.dispatch-poll-enabled=${LABLENS_DISPATCH_POLL_ENABLED:true}
# MQ is an optional wakeup transport. MySQL remains the task execution authority.
lablens.mq.enabled=${LABLENS_MQ_ENABLED:false}
spring.rabbitmq.host=${LABLENS_MQ_HOST:127.0.0.1}
spring.rabbitmq.port=${LABLENS_MQ_PORT:5673}
spring.rabbitmq.username=${LABLENS_MQ_USERNAME:lablens}
spring.rabbitmq.password=${LABLENS_MQ_PASSWORD:}
spring.rabbitmq.virtual-host=${LABLENS_MQ_VHOST:lablens}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.requested-heartbeat=15s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.cache.channel.size=4
spring.rabbitmq.cache.channel.checkout-timeout=2s
management.health.rabbit.enabled=${LABLENS_MQ_ENABLED:false}
lablens.mq.exchange=${LABLENS_MQ_EXCHANGE:lablens.tasks.v1}
lablens.mq.queue=${LABLENS_MQ_QUEUE:lablens.tasks.v1}
lablens.mq.routing-key=${LABLENS_MQ_ROUTING_KEY:task.available.v1}
lablens.mq.dead-letter-exchange=${LABLENS_MQ_DEAD_LETTER_EXCHANGE:lablens.tasks.dead.v1}
lablens.mq.dead-letter-queue=${LABLENS_MQ_DEAD_LETTER_QUEUE:lablens.tasks.dead.v1}
lablens.mq.prefetch=${LABLENS_MQ_PREFETCH:8}
lablens.mq.max-queue-length=${LABLENS_MQ_MAX_QUEUE_LENGTH:10000}
lablens.mq.consumer-auto-startup=${LABLENS_MQ_CONSUMER_AUTO_STARTUP:true}
lablens.mq.database-attempts=${LABLENS_MQ_DATABASE_ATTEMPTS:3}
lablens.mq.database-backoff-ms=${LABLENS_MQ_DATABASE_BACKOFF_MS:250}
lablens.mq.relay-enabled=${LABLENS_MQ_RELAY_ENABLED:true}
lablens.mq.relay-poll-ms=${LABLENS_MQ_RELAY_POLL_MS:500}
lablens.mq.confirm-timeout-ms=${LABLENS_MQ_CONFIRM_TIMEOUT_MS:2000}
lablens.mq.lease-seconds=${LABLENS_MQ_LEASE_SECONDS:15}
lablens.mq.max-attempts=${LABLENS_MQ_MAX_ATTEMPTS:5}
lablens.mq.batch-size=${LABLENS_MQ_BATCH_SIZE:16}
