<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabLens · 实验分析工作台</title>
<style>
:root{color-scheme:dark;--bg:#10171b;--card:#172328;--line:#304248;--text:#e4eeed;--muted:#a5b9b9;--accent:#94e0c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,sans-serif}main{max-width:1160px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.tag{color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px}.eyebrow{color:var(--accent);letter-spacing:3px;font-size:12px;margin-top:38px}h1{font-size:clamp(27px,4vw,43px);line-height:1.3;margin:12px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;margin-top:26px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}h2{font-size:17px;margin:0 0 15px}textarea{width:100%;min-height:110px;resize:vertical;background:#101a1f;border:1px solid #446066;color:var(--text);padding:14px;border-radius:10px;font:inherit}button{border:0;border-radius:8px;background:var(--accent);color:#10352a;padding:11px 18px;font-weight:650;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#2e444a;color:var(--text)}button:disabled{opacity:.5;cursor:wait}.small{font-size:12px;color:var(--muted)}.claim{padding:14px 0;border-bottom:1px solid var(--line)}.source{font:12px ui-monospace,monospace;color:var(--accent);display:block;margin-top:7px;overflow-wrap:anywhere}#status{margin-top:15px;color:var(--accent)}details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:350px;overflow:auto}#limitations{padding-left:20px;color:var(--muted)}.empty{min-height:125px;display:flex;align-items:center;color:var(--muted)}footer{margin-top:26px;color:var(--muted);font-size:12px}a{color:var(--accent)}@media(max-width:800px){.layout{grid-template-columns:1fr}main{padding:24px 16px}.card{padding:18px}}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #b4ffe1;outline-offset:3px}
</style></head><body><main>
<header><span class="brand">◈ LabLens</span><span class="tag">实验分析工作台 · v0.1</span></header>
<div class="eyebrow">ASK · INSPECT · VERIFY</div><h1>让每个实验结论<br>都有据可查。</h1><p>对比模型结果，核对指标口径，展开查看每一步工具调用。</p>
<div class="layout"><section><div class="card"><h2>向实验提问</h2><label for="question" class="small">真实模型问题</label><textarea id="question" maxlength="2000">比较 SFT 和最优 DPO 的准确率及输出长度，有什么结论边界？</textarea><div><button id="live">运行真实模型</button><button id="demo" class="secondary">查看固定离线演示</button></div><p class="small">真实模式需要本地 .env 配置。离线演示固定比较 SFT 与 DPO，不使用上方输入，不调用模型。</p><div id="status" role="status" aria-live="polite">等待运行</div></div>
<div class="card" style="margin-top:22px"><h2>分析结论</h2><div id="answer" class="empty">运行后显示结论与来源。</div><ul id="limitations"></ul><button id="download" class="secondary" hidden>下载本次轨迹 JSON</button></div></section>
<aside class="card"><h2>执行轨迹</h2><p class="small">先查证据，再生成结论。引用检查只核对来源是否被读取；结论是否得到证据支持仍需审核。</p><div id="trace" class="empty">工具调用、返回值与校验错误会显示在这里。</div></aside></div>
<footer>本地研究项目 · 数据为 DPO 验证集结果快照 · <a href="/docs">API 文档</a></footer></main>
<script>
let current=null;const byId=id=>document.getElementById(id);function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
async function run(demo){byId('live').disabled=byId('demo').disabled=true;byId('download').hidden=true;current=null;byId('answer').replaceChildren();byId('limitations').replaceChildren();byId('trace').replaceChildren();byId('status').textContent=demo?'正在执行脚本回放…':'正在调用模型与工具，可能需要数分钟…';try{const response=await fetch(demo?'/api/demo':'/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:demo?undefined:JSON.stringify({question:byId('question').value})});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));current=data;byId('status').textContent=`${data.mode==='scripted_replay'?'离线脚本回放':'真实模型'} · ${data.status} · ${data.model_calls} 次模型步骤 / ${data.tool_calls} 次工具调用 · ${data.latency_seconds}s`;byId('answer').className='';if(data.answer){for(const claim of data.answer.claims){const row=node('div',claim.text,'claim');row.append(node('span',claim.source_ids.join(' · '),'source'));byId('answer').append(row)}if(!data.answer.claims.length)byId('answer').append(node('p','证据不足，无法形成结论。'));for(const item of data.answer.limitations)byId('limitations').append(node('li',item))}else byId('answer').append(node('p',data.error||'执行预算已耗尽，未得到通过校验的最终回答。'));byId('trace').className='';for(const e of data.events){const d=document.createElement('details');d.append(node('summary',`步骤 ${e.step} · ${e.type}${e.name?' / '+e.name:''}`));d.append(node('pre',JSON.stringify(e,null,2)));byId('trace').append(d)}byId('download').hidden=false}catch(e){byId('status').textContent='运行失败：'+e.message}finally{byId('live').disabled=byId('demo').disabled=false}}
byId('demo').onclick=()=>run(true);byId('live').onclick=()=>run(false);byId('download').onclick=()=>{if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`lablens-${current.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
